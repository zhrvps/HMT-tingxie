            const now = new Date();
            const year = now.getFullYear();
            const target = new Date(year, month, day);
            
            // Reset hours for accurate daily calculation
            now.setHours(0, 0, 0, 0);
            target.setHours(0, 0, 0, 0);
            
            const diffTime = target - now;
            const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
            
            return diffDays;
        }

        // Configurable pause settings (for customized dictation writing speed)
        const DICTATION_PAUSE_BASE_MS = 2000;       // Base pause time in milliseconds
        const DICTATION_PAUSE_PER_CHAR_MS = 800;    // Additional pause time per character (e.g. 0.8 seconds per Chinese character)
        const DICTATION_MIN_PAUSE_MS = 3000;        // Minimum pause time in milliseconds

        // Configurable speech engine settings (to make the voice sound as human/natural as possible)
        const DICTATION_SPEECH_RATE = 0.8;          // Speed rate (0.1 to 10. Default is 1.0; 0.8 is slower for clear writing)
        const DICTATION_SPEECH_PITCH = 1.0;         // Pitch (0 to 2. Default is 1.0)

        function getBestChineseVoice() {
            const voices = window.speechSynthesis.getVoices();
            const cnVoices = voices.filter(v => {
                const l = v.lang.toLowerCase().replace('_', '-');
                return l.startsWith('zh-cn') || l === 'zh';
            });
            
            if (cnVoices.length === 0) {
                return voices.find(v => v.lang.toLowerCase().startsWith('zh')) || null;
            }
            
            // Prioritize Siri (macOS/iOS high-quality natural voices)
            const siri = cnVoices.find(v => v.name.includes('Siri'));
            if (siri) return siri;
            
            // Prioritize Enhanced / Premium / Natural voices (if downloaded on macOS/Windows/Chrome)
            const enhanced = cnVoices.find(v => 
                v.name.toLowerCase().includes('enhanced') || 
                v.name.toLowerCase().includes('premium') || 
                v.name.toLowerCase().includes('natural')
            );
            if (enhanced) return enhanced;
            
            // Prioritize standard Tingting (mainland standard pronunciation)
            const tingting = cnVoices.find(v => v.name.toLowerCase().includes('tingting') || v.name.toLowerCase().includes('ting-ting'));
            if (tingting) return tingting;
            
            return cnVoices[0];
        }

        function splitIntoPhrases(text) {
            if (!text) return [];
            return text.split(/[，。！？；,\.!\?;\n]+/)
                .map(p => p.trim())
                .filter(p => p.length > 0);
        }

        function speakPhraseAsync(phrase) {
            return new Promise((resolve) => {
                const utterance = new SpeechSynthesisUtterance(phrase);
                utterance.lang = 'zh-CN';
                utterance.rate = DICTATION_SPEECH_RATE;
                utterance.pitch = DICTATION_SPEECH_PITCH;
                
                // Set the highest quality Chinese voice available on this system
                const bestVoice = getBestChineseVoice();
                if (bestVoice) {
                    utterance.voice = bestVoice;
                }
                
                activeUtterances.push(utterance);
                
                const cleanUp = () => {
                    const index = activeUtterances.indexOf(utterance);
                    if (index > -1) {
                        activeUtterances.splice(index, 1);
                    }
                    resolve();
                };
                
                utterance.onend = cleanUp;
                utterance.onerror = cleanUp;
                
                window.speechSynthesis.speak(utterance);
            });
        }

        function delay(ms, speakId) {
            return new Promise((resolve) => {
                const start = Date.now();
                const interval = setInterval(() => {
                    if (currentSpeakId !== speakId) {
                        clearInterval(interval);
                        resolve();
                    } else if (Date.now() - start >= ms) {
                        clearInterval(interval);
                        resolve();
                    }
                }, 50);
            });
        }

        function getSpeechText(text) {
            if (!text) return "";
            let processed = text;
            
            // Map of specific word replacements to fix common polyphone issues in speech synthesis
            const replacements = [
                // "还" as "hái" (still/also) vs "huán" (return)
                { pattern: /还(要|是|有|真|玩|留|给|能|会|好|算|想|在|未|没)/g, replacement: "孩$1" },
                // "得" as structural particle "de" after verbs/adjectives
                { pattern: /([跑走吃写读看听洗做打玩摔绑记说拿冷热痛快慢高矮胖瘦多小好坏脏累气])得/g, replacement: "$1的" },
                // "觉得" as "jué de"
                { pattern: /觉得/g, replacement: "觉的" },
                // "似的" as "shì de"
                { pattern: /似的/g, replacement: "是的" },
                // "三更半夜" -> "三庚半夜" (gēng)
                { pattern: /三更/g, replacement: "三庚" }
            ];
            
            for (const r of replacements) {
                processed = processed.replace(r.pattern, r.replacement);
            }
            
            // "一" tone sandhi dynamically handled using pinyin-pro if available
            if (window.pinyinPro) {
                const { pinyin } = window.pinyinPro;
                let chars = processed.split('');
                for (let i = 0; i < chars.length - 1; i++) {
                    if (chars[i] === '一') {
                        const nextChar = chars[i + 1];
                        // check if nextChar is a Chinese character
                        if (/[\u4e00-\u9fa5]/.test(nextChar)) {
                            // get the pinyin of the next character
                            const py = pinyin(nextChar, { toneType: 'num', type: 'array' });
                            if (py && py.length > 0) {
                                const toneMatch = py[0].match(/\d/);
                                if (toneMatch) {
                                    const toneNum = parseInt(toneMatch[0]);
                                    if (toneNum === 4) {
                                        chars[i] = '仪'; // 2nd tone for "一" before 4th tone
                                    } else if (toneNum === 1 || toneNum === 2 || toneNum === 3) {
                                        chars[i] = '意'; // 4th tone for "一" before 1st, 2nd, 3rd tone
                                    }
                                }
                            }
                        }
                    }
                }
                processed = chars.join('');
            } else {
                // fallback to original hardcoded lists if library is not loaded
                processed = processed.replace(/一(个|片|次|顿|面|样|阵|会|栋|趟|届|块|句|段|步|份|对|动|共|定|切|下|去|路|宿|半|派|套|岁|处|万)/g, "仪$1");
                processed = processed.replace(/一(双|只|支|张|条|本|把|杯|兜|头|般|帮|批|些|千|百|天|年|家|起|直|边|生|声|心|听|提|摸|回|身|同|溜)/g, "意$1");
            }
            
            return processed;
        }

        async function speak(text, isHint = false) {
            if (!text) return;
            window.speechSynthesis.cancel();
            
            currentSpeakId++;
            const speakId = currentSpeakId;
            
            state.isSpeaking = true;
            render();
            
            try {
                let phrases = [];
                if (isHint) {
                    phrases = [text.replace(/\./g, '')];
                } else {
                    phrases = splitIntoPhrases(text);
                }
                
                const TOTAL_REPEATS = 3;
                for (let rep = 0; rep < TOTAL_REPEATS; rep++) {
                    for (let i = 0; i < phrases.length; i++) {
                        if (currentSpeakId !== speakId) return;
                        
                        const phrase = phrases[i];
                        const spokenPhrase = getSpeechText(phrase);
                        
                        await speakPhraseAsync(spokenPhrase);
                        
                        if (currentSpeakId !== speakId) return;
                        
                        const isLastPhraseOfLastRep = (rep === TOTAL_REPEATS - 1) && (i === phrases.length - 1);
                        if (!isLastPhraseOfLastRep) {
                            const pauseTime = Math.max(
                                DICTATION_MIN_PAUSE_MS, 
                                DICTATION_PAUSE_BASE_MS + phrase.length * DICTATION_PAUSE_PER_CHAR_MS
                            );
                            await delay(pauseTime, speakId);
                        }
                    }
                }
            } catch (err) {
                console.error("Speech synthesis error:", err);
            } finally {
                if (currentSpeakId === speakId) {
                    state.isSpeaking = false;
                    render();
                }
            }
        }

        function stopSpeech() {
            window.speechSynthesis.cancel();
            currentSpeakId++;
            state.isSpeaking = false;
        }

        // Specifically for recitation hints
        function speakRecitationHint() {
            const word = state.sessionWords[state.currentWordIndex];
            if (!word) return;
            // Read only the first 3 characters as a hint
            const hint = word.word.substring(0, 3);
            speak(hint + "...", true);
        }

        function shuffle(array) {
            let arr = [...array];
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                const temp = arr[i];
                arr[i] = arr[j];
                arr[j] = temp;
            }
            return arr;
        }

        function showPreview(level, isCustom = false) {
            state.selectedLevel = isCustom ? "自定义" : level;
            state.view = 'preview';
            render();
        }

        function startDictation() {
            const isCustom = state.selectedLevel === "自定义";
            let source = isCustom ? state.customWords : (SYLLABUS[state.selectedLevel] || []);
            if (source.length === 0) return;

            let finalWords = [];
            if (state.isShuffle) {
                if (!isCustom && source.length > 1) {
                    // 1. Identify Recitation (last item)
                    const recitationPart = source.slice(-1);
                    const dictationPart = source.slice(0, -1);
                    
                    // 2. Separate dictationPart into Words and Sentences
                    const wordsPart = dictationPart.filter(item => 
                        item.word.length <= 7 && !item.word.includes('，') && !item.word.includes('。')
                    );
                    const sentencesPart = dictationPart.filter(item => 
                        item.word.length > 7 || item.word.includes('，') || item.word.includes('。')
                    );
                    
                    // 3. Combine: Shuffled Words + Shuffled Sentences + Recitation
                    finalWords = [...shuffle(wordsPart), ...shuffle(sentencesPart), ...recitationPart];
                } else {
                    finalWords = shuffle(source);
                }
            } else {
                finalWords = [...source];
            }

            state.sessionWords = finalWords;
            state.currentWordIndex = 0;
            state.view = 'dictation';
            render();
            
            // Check if first word is the recitation item
            const isLastWord = state.currentWordIndex === state.sessionWords.length - 1;
            if (isLastWord && state.selectedLevel !== "自定义") {
                setTimeout(() => speakRecitationHint(), 500);
            } else {
                setTimeout(() => speak(state.sessionWords[0].word), 500);
            }
        }

        function handleFileUpload(e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (event) => {
                const text = event.target.result;
                const words = text.split(/[\n,]+/).map(w => w.trim()).filter(w => w !== '');
                state.customWords = words.map(w => ({ word: w }));
                render();
            };
            reader.readAsText(file);
        }

        function nextWord() {
            stopSpeech();
            if (state.currentWordIndex < state.sessionWords.length - 1) {
                state.currentWordIndex++;
                render();
                
                const isLastWord = state.currentWordIndex === state.sessionWords.length - 1;
                if (isLastWord && state.selectedLevel !== "自定义") {
                    setTimeout(() => speakRecitationHint(), 500);
                } else {
                    setTimeout(() => speak(state.sessionWords[state.currentWordIndex].word), 500);
                }
            } else {
                state.view = 'summary';
                render();
            }
        }

                            </div>
                            <h2 class="text-2xl font-black text-slate-800">听写完成!</h2>
                            <p class="text-slate-400 text-sm mt-1">请对照纸上作业核对答案</p>
                        </div>

                        <div class="flex-1 overflow-y-auto px-6 my-6 custom-scrollbar">
                            <div class="space-y-3">
                            ${state.sessionWords.map((item, idx) => `
                                <div class="flex items-center justify-between p-4 bg-slate-50 rounded-2xl border border-slate-100 ${idx === state.sessionWords.length - 1 ? 'border-l-4 border-l-red-500 bg-red-50/30' : ''}">
                                    <div class="flex flex-col text-left flex-1 mr-4">
                                        ${idx === state.sessionWords.length - 1 ? '<span class="text-[10px] font-bold text-red-500 uppercase tracking-widest mb-1">默写句子</span>' : ''}
                                        <span class="font-bold text-slate-800 text-lg leading-relaxed">${item.word}</span>
                                    </div>
                                    <span class="text-slate-300 font-bold">#${idx + 1}</span>
                                </div>
                            `).join('')}
                            </div>
                        </div>

                        <div class="p-6 pt-0 mt-auto flex flex-col space-y-3">
                            <button onclick="state.view='preview'; render()" class="w-full bg-red-500 text-white font-bold py-4 rounded-2xl shadow-lg hover:bg-red-600">再练一次</button>
                            <button onclick="state.view='home'; render()" class="w-full bg-slate-100 text-slate-600 font-bold py-4 rounded-2xl hover:bg-slate-200">返回首页</button>
                        </div>
                    </div>
                `;
            }

            container.innerHTML = html;
            lucide.createIcons();
        }

        // Initialize
        window.onload = render;
    </script>
</body>
</html>
